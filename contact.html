<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jeremiah Okyere</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Whoami</a></li>
                <li><a href="projecten.html">Projecten</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="pagina-titel">Contact</h1>
        <form id="contact-form" novalidate>
            <div class="veld">
                <label for="naam">Naam</label>
                <input type="text" id="naam" name="naam" aria-describedby="naam-fout">
                <p class="fout" id="naam-fout"></p>
            </div>
            <div class="veld">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" aria-describedby="email-fout">
                <p class="fout" id="email-fout"></p>
            </div>
            <div class="veld">
                <label for="bericht">Bericht</label>
                <textarea id="bericht" name="bericht" rows="5" aria-describedby="bericht-fout"></textarea>
                <p class="fout" id="bericht-fout"></p>
            </div>
            <button type="submit">Verstuur</button>
            <p id="formulier-status" role="status"></p>
        </form>
    </main>
    <footer>
        <p>© 2026 Jeremiah Okyere</p>
    </footer>
    <script src="js/contact.js"></script>
</body>
</html>
